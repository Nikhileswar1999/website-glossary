<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Global Wealth & Risk Tools Hub</title>
    <meta
      name="description"
      content="Global Wealth & Risk Tools Hub: no-API calculators, country-specific finance planning tools, glossary, and risk insights for US, UK, Singapore, and India."
    />
    <meta name="theme-color" content="#0a1222" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="dark">
    <div class="app-shell">
      <aside class="sidebar glass">
        <h2>Tools</h2>
        <nav id="toolNav" class="tool-nav" aria-label="Tool navigation"></nav>
        <div class="ad-slot">Ad zone: sidebar sponsor</div>
      </aside>

      <div class="main-column">
        <header class="topbar glass">
          <div>
            <p class="eyebrow">Global Wealth & Risk Tools Hub</p>
            <h1>No-API Finance Dashboard</h1>
          </div>
          <div class="switcher-wrap">
            <label for="countrySelector">Country</label>
            <select id="countrySelector" aria-label="Select country profile">
              <option value="US">United States</option>
              <option value="UK">United Kingdom</option>
              <option value="SG">Singapore</option>
              <option value="IN">India</option>
            </select>
          </div>
        </header>

        <section class="dash-row">
          <article class="glass metric-card">
            <h3>Financial Score</h3>
            <p id="financialScore">0 / 100</p>
          </article>
          <article class="glass metric-card">
            <h3>Daily Tip</h3>
            <p id="dailyTip"></p>
          </article>
          <article class="glass metric-card toggles">
            <button id="eli12Btn" class="btn">Explain Like I'm 12</button>
            <button id="advancedBtn" class="btn ghost">Advanced Mode</button>
          </article>
        </section>

        <main id="dashboard" class="dashboard"></main>

        <section class="glass section-gap">
          <div class="split-head">
            <h2>Country Glossary (SEO)</h2>
            <div id="glossaryTabs" class="tabs"></div>
          </div>
          <div id="glossaryList" class="glossary-grid"></div>
        </section>
      </div>

      <aside class="right-rail glass">
        <h2>Insights & Trends</h2>
        <div class="panel">
          <h3>Trending Terms</h3>
          <ul id="trendingTerms"></ul>
        </div>
        <div class="panel">
          <h3>Portfolio Mix Chart</h3>
          <canvas id="portfolioChart" height="200"></canvas>
        </div>
        <div class="panel">
          <h3>Growth Chart</h3>
          <canvas id="growthChart" height="200"></canvas>
        </div>
        <div class="ad-slot">Ad zone: in-feed insights</div>
      </aside>
    </div>

    <div class="mobile-sticky-ad">Ad zone: mobile sticky banner</div>

    <script src="app.js" defer></script>
  </body>
</html>
