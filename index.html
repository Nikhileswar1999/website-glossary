<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JSON Workbench</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="layout">
      <aside class="sidebar" aria-label="Tools">
        <h1>JSON Workbench</h1>
        <nav id="tabNav" class="tab-nav">
          <button class="tab-btn active" data-tab="formatter" type="button">Formatter</button>
          <button class="tab-btn" data-tab="validator" type="button">Validator</button>
          <button class="tab-btn" data-tab="pretty" type="button">Pretty Print</button>
          <button class="tab-btn" data-tab="minify" type="button">Minify</button>
          <button class="tab-btn" data-tab="stringify" type="button">Stringify</button>
          <button class="tab-btn" data-tab="oneline" type="button">To One Line</button>
          <button class="tab-btn" data-tab="editor" type="button">Editor</button>
        </nav>
      </aside>

      <section class="content">
        <header class="topbar">
          <div>
            <h2 id="activeTitle">Formatter</h2>
            <p id="activeDescription">Format JSON with consistent indentation.</p>
          </div>
          <button id="themeToggle" class="btn secondary" type="button">Toggle theme</button>
        </header>

        <section class="toolbar">
          <label class="btn secondary" for="fileInput">Upload JSON</label>
          <input id="fileInput" type="file" accept="application/json,.json,text/plain" hidden />

          <button id="runBtn" class="btn" type="button">Run Tool</button>
          <button id="clearBtn" class="btn secondary" type="button">Clear</button>
          <button id="copyBtn" class="btn secondary" type="button">Copy Output</button>
          <button id="downloadBtn" class="btn secondary" type="button">Download Output</button>

          <label for="indentSelect">Indent</label>
          <select id="indentSelect">
            <option value="2">2 spaces</option>
            <option value="4" selected>4 spaces</option>
          </select>
        </section>

        <section id="stringifyPanel" class="tool-panel" hidden>
          <label for="stringifyInput">Text to stringify as JSON string</label>
          <textarea id="stringifyInput" rows="4" placeholder="Paste plain text here..."></textarea>
        </section>

        <section class="panes">
          <article>
            <h3>Input</h3>
            <textarea id="inputEditor" spellcheck="false" placeholder="Paste JSON or text input..."></textarea>
          </article>
          <article>
            <h3>Output</h3>
            <textarea id="outputEditor" readonly aria-live="polite"></textarea>
          </article>
        </section>

        <div id="status" class="status">Ready.</div>
      </section>
    </main>

    <script src="json-engine.js"></script>
    <script src="app.js"></script>
  </body>
</html>
